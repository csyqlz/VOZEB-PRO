services:
  postgres:
    image: postgres:16.6-alpine
    container_name: vozeb-pro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vozeb_pro}
      POSTGRES_USER: ${POSTGRES_USER:-vozeb_pro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - vozeb-pro-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vozeb_pro} -d ${POSTGRES_DB:-vozeb_pro}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${VOZEB_PRO_IMAGE:-ghcr.io/csyqlz/vozeb-pro:v0.0.7}
    container_name: vozeb-pro
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - vozeb-pro-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      VOZEB_PRO_DATA_DIR: /app/web/.data
      VOZEB_PRO_INTERNAL_ORIGIN: http://127.0.0.1:3000
      VOZEB_PRO_DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-vozeb_pro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vozeb_pro}
      VOZEB_PRO_DATABASE_POOL_MAX: ${VOZEB_PRO_DATABASE_POOL_MAX:-10}
      VOZEB_PRO_DATABASE_SSL: "0"
      VOZEB_PRO_ENCRYPTION_KEY: ${VOZEB_PRO_ENCRYPTION_KEY:?请在 .env 中配置 VOZEB_PRO_ENCRYPTION_KEY}
      VOZEB_PRO_INSTALL_TOKEN: ${VOZEB_PRO_INSTALL_TOKEN:?请在 .env 中配置至少 32 位一次性安装令牌}
      VOZEB_PRO_MAINTENANCE_TOKEN: ${VOZEB_PRO_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      VOZEB_PRO_WORKER_TOKEN: ${VOZEB_PRO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ${VOZEB_PRO_IMAGE:-ghcr.io/csyqlz/vozeb-pro:v0.0.7}
    container_name: vozeb-pro-generation-worker
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    environment:
      VOZEB_PRO_WORKER_API_ORIGIN: http://app:3000
      VOZEB_PRO_WORKER_TOKEN: ${VOZEB_PRO_WORKER_TOKEN:?请在 .env 中配置独立的至少 32 位 Worker 令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vozeb-pro-data:
  vozeb-pro-postgres:
